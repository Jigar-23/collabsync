services:
  redis:
    image: redis:7-alpine
    container_name: collabsync-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  server-node-1:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: collabsync-node-1
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/app/data
    volumes:
      - node1_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  server-node-2:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: collabsync-node-2
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/app/data
    volumes:
      - node2_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  load-balancer:
    image: nginx:alpine
    container_name: collabsync-lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server-node-1
      - server-node-2
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: collabsync-web
    ports:
      - "3000:80"
    depends_on:
      - load-balancer
    restart: unless-stopped

volumes:
  node1_data:
  node2_data:
